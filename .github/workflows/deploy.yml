name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # First attempt 07:17 UTC (08:17 CET / 09:17 CEST), then recovery attempts.
    # A live deployment stamp prevents repeated image processing/builds.
    - cron: '17,37,57 7-11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promotion-check:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.live.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/promotion-deployment.mjs
            /src/data/storyPromotion.mjs
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check live deployment
        id: live
        run: node scripts/promotion-deployment.mjs check

  build:
    needs: promotion-check
    if: github.event_name != 'schedule' || needs.promotion-check.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Dependency installation is fast; avoid the package-cache egress timeout.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Astro image assets
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          # Restore compatible images, then save new variants under this commit.
          key: ${{ runner.os }}-astro-images-v1-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-images-v1-${{ hashFiles('pnpm-lock.yaml', 'astro.config.mjs') }}-
      - name: Check promotion rules
        run: |
          node scripts/test-story-promotion.mjs
          node scripts/test-promotion-deployment.mjs
      - name: Build
        run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: https://fmxiyfhncvhnwzwipnxu.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_STORY_ADMIN_URL: https://fmxiyfhncvhnwzwipnxu.supabase.co/functions/v1/admin-story-submissions
      - name: Stamp validated deployment
        run: node scripts/promotion-deployment.mjs write
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
